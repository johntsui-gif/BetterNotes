<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00877a"><meta name="apple-mobile-web-app-capable" content="yes"><title>BetterNotes · Notebook workspace</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css?v=20261105"><script defer src="lucide.min.js"></script><script defer src="jszip.min.js"></script><script defer src="app.js?v=20261105"></script><script defer src="drive.js"></script></head><body>
<aside id="side"><div class="brand"><span class="brandicon"><i data-lucide="notebook-pen"></i></span>BetterNotes</div><div class="micro">WORKSPACE</div><nav id="nav"></nav><div class="micro folderhead">FOLDERS<button id="folderAdd" aria-label="Create folder">＋</button></div><nav id="folders"></nav><div class="sidebottom"><button id="drive"><i data-lucide="cloud"></i><span>Google Drive<small id="syncState">Connect account</small></span><i data-lucide="chevron-right"></i></button><button id="install"><i data-lucide="download"></i>Install app</button></div></aside>
<main><header><button id="hamb" aria-label="Toggle sidebar"><i data-lucide="menu"></i></button><span class="crumb"><i data-lucide="panels-top-left"></i> Workspace <b>/</b> <strong id="crumb">Library</strong></span><label class="search"><i data-lucide="search"></i><input id="search" placeholder="Search notebooks" aria-label="Search notebooks"><kbd>⌘ K</kbd></label></header>
<section id="library"><div class="top"><div><div class="micro accent"><span class="dot"></span> PERSONAL WORKSPACE</div><h1 id="heading">My library</h1><p id="subtitle">A home for your notebooks, ideas, and collected thoughts.</p></div><div class="actions"><button class="outline" id="import"><i data-lucide="upload"></i>Import</button><button class="primary" id="create"><i data-lucide="plus"></i>New notebook</button></div></div>
<div id="feature"><div class="herotext"><div class="label"><i data-lucide="history"></i> PICK UP WHERE YOU LEFT OFF</div><h2 id="recentTitle"></h2><div id="recentMeta"></div><button id="resume">Open notebook <i data-lucide="arrow-up-right"></i></button></div><img alt="" src="stack.svg"></div>
<div class="shelfhead"><div><h2 id="shelfTitle">All notebooks</h2><span id="count"></span></div><div class="views"><button id="gridBtn" aria-label="Grid view"><i data-lucide="layout-grid"></i></button><button id="listBtn" aria-label="List view"><i data-lucide="list"></i></button></div></div><div id="books"></div></section>
<section id="editor" hidden><div class="editorHead"><button class="outline" id="back">← Library</button><h2 id="docTitle"></h2><button class="outline" id="present"><i data-lucide="presentation"></i>Present</button></div><div id="tools"></div><div id="paperWrap"><div id="paper"><img id="base" alt=""><svg id="ink" xmlns="http://www.w3.org/2000/svg"></svg></div></div><div id="pages"></div></section></main>
<dialog id="modal"><form method="dialog"><button class="close" aria-label="Close">×</button></form><div id="dialogBody"></div></dialog><div id="toast" role="status"></div><div id="tip" role="tooltip"></div><input id="file" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.zip,.goodnotes,.betternotes,.inkfolio" hidden>
</body></html>
